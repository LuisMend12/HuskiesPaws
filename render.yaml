# Render Blueprint: deploys the HuskiesPaws server (web app + API) with HTTPS.
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the secret
# values it asks for. See server/README.md.
services:
  - type: web
    name: huskiespaws
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: XAI_API_KEY # Grok Voice + Imagine (required for the Cursor track)
        sync: false
      - key: MAPBOXKEY # public Mapbox token (pk....)
        sync: false
      - key: SUPABASE_URL # optional: keeps leaderboards and turf across redeploys
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
