<script src="motion.js"></script><script>
const c=document.getElementById('film'),ctx=c.getContext('2d');

 for(const [px,py,r] of [[-23,-21,10],[-8,-34,10],[10,-34,10],[25,-20,10]]){ctx.beginPath();ctx.ellipse(px,py,r,r*1.3,0,0,Math.PI*2);ctx.fill()}
 ctx.beginPath();ctx.moveTo(-25,13);ctx.bezierCurveTo(-25,-7,-8,-19,0,-17);ctx.bezierCurveTo(9,-19,27,-5,26,14);ctx.bezierCurveTo(24,31,9,19,0,21);ctx.bezierCurveTo(-10,20,-23,31,-25,13);ctx.fill();ctx.restore()}

ctx.globalAlpha=1-land;

ctx.strokeStyle='#dde8df';ctx.lineWidth=70;ctx.lineJoin='round';ctx.stroke(new Path2D(svg.getAttribute('d')));

ctx.fillStyle=C.ink;ctx.beginPath();ctx.roundRect(1295,270,340,86,22);ctx.fill();text('Landmark discovered',1320,325,27,'#ffffff');
ctx.strokeStyle=C.green;ctx.lineWidth=7;ctx.beginPath();ctx.arc(1490,450,76*arrival,0,Math.PI*2);ctx.stroke();
ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.shadowColor='#0b1f3a18';ctx.shadowBlur=28;ctx.beginPath();ctx.arc(p[0],p[1],64+land*42,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.globalAlpha=1-land;paw(p[0],p[1],1.15+land*.6,t>1.1&&t<4.2?Math.sin((t-1.1)*10)*.1:0);
ctx.globalAlpha=land;ctx.drawImage(logo,p[0]-106,p[1]-106,212,212);
text('HuskiesPaws',805,478,90);text('Walk more. Explore more.',809,544,32,C.muted,600);text('Every step starts something.',809,596,27,C.green,600);
ctx.restore();

window.__motion=(a,b)=>{const A=state(a),B=state(b),p=OM.project(A.M,...A.p),q=OM.project(B.M,...B.p);return Math.hypot(p[0]-q[0],p[1]-q[1])+OM.screenTravel(OM.camera(a,[]),OM.camera(b,[]),OM.camera((a+b)/2,[]))};
window.__ready=Promise.all([document.fonts.load('900 78px Nunito'),document.fonts.load('600 30px Nunito'),logo.decode()]).then(()=>{seek(0);opening.getContext('2d').drawImage(c,0,0);return true});
